version: 2
updates:
  - package-ecosystem: "npm"
    versioning-strategy: "increase"
    directory: "/"
    schedule:
      interval: "cron"
      # Triggers quarterly at midnight on the 1st of January, April, July, and October
      cronjob: "0 0 1 1,4,7,10 *"
    cooldown:
      default-days: 14 # 14-day delay protects your patches from day-one flaws
    labels:
      - "dependencies"
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      # Triggers quarterly at midnight on the 1st of January, April, July, and October
      cronjob: "0 0 1 1,4,7,10 *"
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"